name: Daily NHL Data Update

on:
  # GitHub Actions owns the daily refresh. The Windows Task Scheduler job
  # "NHL Daily Data Update" (daily_update.bat) is disabled: its task runs only
  # in an interactive logon session with WakeToRun off, so a machine that is
  # asleep or signed out at 5 AM silently skips the day. A cloud runner has no
  # such dependency. Do not re-enable both -- two runners race on the same
  # caches and double-hit the SharpAPI quota.
  schedule:
    # Two scheduled runs. Both are off the hour because GitHub delays runs
    # queued at :00 when the fleet is busy.
    #
    # GitHub does not fire scheduled workflows on time: these runs have been
    # starting 4-8h after their cron time (confirmed in the Actions tab), which
    # pushed the old 05:07 ET run to ~09:00-13:00 ET and left Today's Picks
    # stale at wake-up. So the overnight run is scheduled hours early to absorb
    # that delay before it lands.
    #
    # 1) Overnight baseline -- 02:07 UTC = 22:07 ET (EDT) / 21:07 ET (EST).
    #    Even a worst-case 8h delay still finishes by ~06:07 ET, so today's
    #    picks exist before you wake up.
    - cron: '7 2 * * *'
    # 2) Afternoon fresh-odds sweep -- 21:37 UTC = 17:37 ET (EDT) / 16:37 ET
    #    (EST). Odds move through the day; this re-sweeps them right before
    #    puck drop so edges and props aren't priced off the overnight snapshot.
    - cron: '37 21 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write

# Never let a delayed run overlap the next day's; queue instead of cancelling.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # update_odds.py treats a missing key as "no live odds" and exits 0, so
      # without this guard the whole job would succeed and push an empty board.
      - name: Verify SHARPAPI_KEY is set
        run: |
          if [ -z "$SHARPAPI_KEY" ]; then
            echo "::error::SHARPAPI_KEY secret is not set; odds, edges and props would be empty."
            exit 1
          fi

      - name: Run PBP stats update
        run: python update_pbp_stats.py

      - name: Run Elo ratings update
        run: python update_elo_ratings.py --current-season

      - name: Run odds + betting edge update
        run: python update_odds.py --all

      - name: Run injuries update
        run: python update_injuries.py

      - name: Run rosters update
        run: python update_rosters.py

      - name: Run lineups update (PP units)
        run: python update_lineups.py

      - name: Run Today's Picks pre-computation
        run: python update_todays_picks.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/ pbp_cache/shots/*.parquet elo_ratings.db models/xg_validation.json \
                  injuries.json rosters.json rookie_projections.json lineups.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "🤖 Daily data update: PBP stats + Elo ratings" -m "Triggered by GitHub Actions"
          # A manual push or a previous delayed run may have landed while the
          # pipeline ran; rebase onto it rather than failing the push.
          git pull --rebase --autostash origin main
          git push
